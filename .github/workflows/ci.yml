name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows is the primary target: the app spawns `opencode.cmd`, reaps the
    # child with `taskkill /T /F`, and encrypts BYOK keys through DPAPI via
    # Electron `safeStorage`. None of that is exercised on Linux, so Windows
    # is a first-class leg rather than a nightly afterthought.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test
